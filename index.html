<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Fruit Basket Catch</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #f6f2e8;
    text-align: center;
    font-family: Arial, sans-serif;
}

#gameWrapper {
    width: 375px;   /* スマホ固定幅 */
    height: 600px;
    margin: 0 auto;
    position: relative;
}

canvas {
    background: #e8dfcf;
    display: block;
}

#overlay {
    position: absolute;
    inset: 0;
    background: #e8dfcf;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

#titleBox {
    background: #6b4423;
    color: #fff;
    padding: 14px 28px;
    font-size: 28px;
    margin-bottom: 30px;
}

#startBtn {
    background: #8b5a2b;
    color: #fff;
    border: none;
    padding: 14px 40px;
    font-size: 20px;
    border-radius: 12px;
}
</style>
</head>

<body>

<div id="gameWrapper">
    <canvas id="gameCanvas" width="375" height="600"></canvas>

    <div id="overlay">
        <div id="titleBox">Fruit Basket Catch</div>
        <button id="startBtn">START</button>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");

const FRUITS = ["🍎","🍌","🍇","🍒","🍑"];
const BOMB = "💣";

let items = [];
let score = 0;
let timeLeft = 30;
let gameRunning = false;

/* 🧺 カゴ（編み込み風） */
const basket = {
    x: canvas.width/2 - 50,
    y: canvas.height - 70,
    width: 100,
    height: 40
};

/* ---------- タイトル背景（静止） ---------- */
const titleItems = [];
for(let i=0;i<40;i++){
    titleItems.push({
        emoji: Math.random()<0.25 ? BOMB : FRUITS[Math.floor(Math.random()*FRUITS.length)],
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height
    });
}

function drawTitleBackground(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.font = "32px serif";
    titleItems.forEach(i=>{
        ctx.fillText(i.emoji,i.x,i.y);
    });
}

/* ---------- ゲーム処理 ---------- */
function spawnItem(){
    const isBomb = Math.random() < 0.3;
    items.push({
        emoji: isBomb ? BOMB : FRUITS[Math.floor(Math.random()*FRUITS.length)],
        x: Math.random()*(canvas.width-30),
        y: -30,
        speed: 2 + Math.random()*2,
        isBomb
    });
}

function drawBasket(){
    ctx.fillStyle = "#8b5a2b";
    ctx.fillRect(basket.x,basket.y,basket.width,basket.height);

    ctx.strokeStyle = "#6b4423";
    for(let i=0;i<5;i++){
        ctx.beginPath();
        ctx.moveTo(basket.x + i*20, basket.y);
        ctx.lineTo(basket.x + i*20, basket.y + basket.height);
        ctx.stroke();
    }
}

function updateGame(){
    if(!gameRunning) return;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(Math.random()<0.04) spawnItem();

    items.forEach((item,i)=>{
        item.y += item.speed;
        ctx.font = "30px serif";
        ctx.fillText(item.emoji,item.x,item.y);

        if(
            item.y > basket.y &&
            item.x > basket.x &&
            item.x < basket.x + basket.width
        ){
            score += item.isBomb ? -2 : 1;
            items.splice(i,1);
        }

        if(item.y > canvas.height){
            items.splice(i,1);
        }
    });

    drawBasket();

    ctx.fillStyle="#000";
    ctx.font="18px Arial";
    ctx.fillText("Score: "+score,10,25);
    ctx.fillText("Time: "+timeLeft,280,25);

    requestAnimationFrame(updateGame);
}

/* ---------- タイマー ---------- */
function startTimer(){
    const timer = setInterval(()=>{
        if(!gameRunning){
            clearInterval(timer);
            return;
        }
        timeLeft--;
        if(timeLeft<=0){
            gameRunning=false;
            alert("TIME UP\nScore: "+score);
            location.reload();
        }
    },1000);
}

/* ---------- 操作 ---------- */
canvas.addEventListener("touchmove",e=>{
    const rect=canvas.getBoundingClientRect();
    basket.x=e.touches[0].clientX-rect.left-basket.width/2;
});

/* ---------- START ---------- */
document.getElementById("startBtn").onclick=()=>{
    overlay.style.display="none";
    gameRunning=true;
    startTimer();
    updateGame();
};

/* 初期表示 */
drawTitleBackground();
</script>

</body>
</html>
